
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CalcX</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080d18;color:white;font-family:Arial,sans-serif}
.calculator{width:min(350px,94vw);padding:22px;background:#121b2c;border-radius:22px}
#display{width:100%;padding:20px 10px;background:#080d18;color:white;border:0;border-radius:12px;font-size:28px;text-align:right;margin-bottom:14px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button{padding:14px 8px;border:0;border-radius:10px;background:#27364d;color:white;font-size:16px;cursor:pointer}
button:hover{filter:brightness(1.2)}
.op{background:#087e99}
.library{display:none;position:fixed;inset:0;z-index:9999;overflow:auto;background:#17171c;color:white;padding:16px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#222227;padding:12px;border-radius:12px}
.topbar h2{margin:0;color:white}
.topbar input{flex:1;min-width:150px;padding:13px;border-radius:24px;border:1px solid #777;background:#25252b;color:white;font-size:15px}
.exit{background:#3985ff;padding:13px 22px}
.categories{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}
.categories button{border-radius:24px;background:#292a32;border:1px solid #393a44}
.categories button.active{background:#087e99}
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}
.game-card{min-height:165px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:15px;border-radius:14px;background:linear-gradient(145deg,#374b76,#161d30);border:1px solid #ffffff18}
.game-icon{font-size:48px}
.game-card small{display:block;margin-top:5px;color:#b9c5db}
.empty{color:#aaa}
@media(max-width:450px){.library{padding:10px}.game-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>

<main class="calculator" id="calculator">
<h2 style="color:#67e8f9">CalcX</h2>
<input id="display" value="0" readonly>
<div class="keys" id="keys"></div>
</main>

<section class="library" id="library">
<header class="topbar">
<h2>🎮 GameZone</h2>
<input id="search" placeholder="Search games...">
<button class="exit" id="exit">Exit</button>
</header>
<nav class="categories" id="categories">
<button class="active" data-category="All">✨ All</button>
<button data-category="Action">💥 Action</button>
<button data-category="Arcade">🕹️ Arcade</button>
<button data-category="Puzzle">🧩 Puzzle</button>
<button data-category="Racing">🏎️ Racing</button>
<button data-category="Adventure">🗺️ Adventure</button>
<button data-category="Sports">⚽ Sports</button>
<button data-category="Casual">🎯 Casual</button>
</nav>
<div class="game-grid" id="gameGrid"></div>
<p class="empty" id="empty" hidden>No games found.</p>
</section>

<script>
const $=id=>document.getElementById(id);
const display=$("display");
let expression="",code="",currentCategory="All",libraryOpen=false;

const buttons=["AC","(",")","÷","7","8","9","×","4","5","6","−","1","2","3","+","0",".","⌫","="];

buttons.forEach(key=>{
 const b=document.createElement("button");
 b.textContent=key;
 if("÷×−+=".includes(key))b.className="op";
 b.onclick=()=>press(key,true);
 $("keys").appendChild(b);
});

const games=[
{name:"Pixel World",category:"Adventure",icon:"🌲"},
{name:"Brain Teaser",category:"Puzzle",icon:"🧩"},
{name:"Speed Circuit",category:"Racing",icon:"🏎️"},
{name:"Arcade Challenge",category:"Arcade",icon:"👾"},
{name:"Mystery Island",category:"Adventure",icon:"🏝️"},
{name:"Block Puzzles",category:"Puzzle",icon:"🟦"},
{name:"Turbo Track",category:"Racing",icon:"🏁"},
{name:"Retro Arcade",category:"Arcade",icon:"🕹️"},
{name:"Action Arena",category:"Action",icon:"⚔️"},
{name:"Goal Champion",category:"Sports",icon:"⚽"},
{name:"Sky Adventure",category:"Adventure",icon:"🚀"},
{name:"Bubble Pop",category:"Casual",icon:"🫧"},
{name:"Neon Runner",category:"Action",icon:"🏃"},
{name:"Perfect Shot",category:"Sports",icon:"🏀"},
{name:"Drift Legends",category:"Racing",icon:"🚘"},
{name:"Color Match",category:"Puzzle",icon:"🎨"},
{name:"Mini Golf",category:"Casual",icon:"⛳"},
{name:"Dungeon Quest",category:"Adventure",icon:"🏰"},
{name:"Space Blaster",category:"Action",icon:"🚀"},
{name:"Memory Match",category:"Puzzle",icon:"🧠"}
];

function press(key,checkCode=false){
 if(checkCode&&/^[0-9]$/.test(key)){
  code=(code+key).slice(-4);
  if(code==="6767"){code="";openLibrary();return;}
 }else if(key!=="⌫"){code=""}

 if(key==="AC")expression="";
 else if(key==="⌫")expression=expression.slice(0,-1);
 else if(key==="="){
  try{
   if(!expression||!/^[0-9+*/(). -]+$/.test(expression))throw Error();
   const result=Function('"use strict";return ('+expression+')')();
   if(!Number.isFinite(result))throw Error();
   expression=String(result);
  }catch{expression="";display.value="Error";return}
 }else{
  expression+=({"×":"*","÷":"/","−":"-"}[key]||key);
 }
 display.value=expression?expression.replace(/\*/g,"×").replace(/\//g,"÷"):"0";
}

document.addEventListener("keydown",e=>{
 if(libraryOpen){
  if(e.key==="Escape")closeLibrary();
  return;
 }
 if(/^[0-9]$/.test(e.key)){
  code=(code+e.key).slice(-4);
  if(code==="6767"){code="";openLibrary();return;}
  press(e.key,false);
 }else if(e.key==="Backspace"){code="";press("⌫")}
 else if(e.key==="Enter"){code="";press("=")}
 else if(e.key==="Escape"){code="";press("AC")}
 else if("+-*/().".includes(e.key)){code="";press(e.key)}
});

function openLibrary(){
 libraryOpen=true;
 $("calculator").style.display="none";
 $("library").style.display="block";
 renderGames();
}

function closeLibrary(){
 libraryOpen=false;
 $("library").style.display="none";
 $("calculator").style.display="block";
 expression="";
 code="";
 display.value="0";
}

$("exit").onclick=closeLibrary;

function renderGames(){
 const query=$("search").value.toLowerCase().trim();
 const grid=$("gameGrid");
 grid.replaceChildren();
 const filtered=games.filter(g=>
  (currentCategory==="All"||g.category===currentCategory)&&
  g.name.toLowerCase().includes(query)
 );
 filtered.forEach(g=>{
  const card=document.createElement("article");
  card.className="game-card";
  const icon=document.createElement("span");
  icon.className="game-icon";
  icon.textContent=g.icon;
  const name=document.createElement("strong");
  name.textContent=g.name;
  const category=document.createElement("small");
  category.textContent=g.category;
  card.append(icon,name,category);
  grid.appendChild(card);
 });
 $("empty").hidden=filtered.length>0;
}

$("search").addEventListener("input",renderGames);

$("categories").addEventListener("click",e=>{
 const button=e.target.closest("button[data-category]");
 if(!button)return;
 currentCategory=button.dataset.category;
 document.querySelectorAll("#categories button").forEach(b=>
  b.classList.toggle("active",b===button)
 );
 renderGames();
});
</script>
</body>
</html>
