```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#080b12;color:white;
  font-family:Arial,sans-serif
}
button,input{font:inherit}
#calculator{
  width:min(340px,94vw);margin:55px auto;
  padding:20px;background:#171b26;
  border-radius:22px;box-shadow:0 15px 50px #0008
}
#display{
  width:100%;height:75px;border:0;border-radius:12px;
  background:#0a0d14;color:white;text-align:right;
  padding:15px;font-size:30px;margin-bottom:14px
}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.keys button{
  height:59px;border:0;border-radius:12px;
  background:#292f40;color:white;cursor:pointer;font-size:20px
}
.keys button:hover{background:#414b64}
.keys .operator{background:#5269e8}
.keys .clear{background:#b84459}
#library{display:none;padding:22px;min-height:100vh}
header{display:flex;gap:15px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
header h1{margin:0;font-size:28px}
#search{
  flex:1;min-width:180px;padding:13px 16px;
  border-radius:12px;border:1px solid #343b4d;
  background:#141a27;color:white
}
#categories{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
#categories button{
  border:1px solid #343b4d;background:#171d2b;
  color:#ddd;padding:10px 15px;border-radius:20px;cursor:pointer
}
#categories button.active{background:#536cf0;color:white}
#games{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:18px
}
.game{
  overflow:hidden;background:#141a27;border:1px solid #252d40;
  border-radius:15px;cursor:pointer;transition:.18s
}
.game:hover{transform:translateY(-4px);border-color:#647cff}
.game img{width:100%;height:125px;object-fit:cover;display:block}
.game h3{margin:12px 12px 5px;font-size:17px}
.game p{margin:0 12px 14px;color:#9ba6bd;font-size:13px}
#viewer{
  display:none;position:fixed;inset:0;z-index:5;background:#080b12;
  flex-direction:column
}
#viewerbar{
  height:58px;display:flex;align-items:center;justify-content:space-between;
  padding:0 15px;background:#151b28
}
#viewerbar button{
  border:0;background:#536cf0;color:white;border-radius:9px;
  padding:10px 15px;cursor:pointer
}
#gameframe{flex:1;width:100%;border:0;background:#fff}
#empty{display:none;color:#9ba6bd;padding:25px}
@media(max-width:480px){
  #library{padding:14px}
  #games{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .game img{height:100px}
  .game h3{font-size:14px}
}
</style>
</head>

<body>
<section id="calculator">
  <input id="display" value="0" readonly aria-label="Calculator display">
  <div class="keys">
    <button class="clear" onclick="clearCalc()">AC</button>
    <button onclick="press('(')">(</button>
    <button onclick="press(')')">)</button>
    <button class="operator" onclick="press('/')">÷</button>

    <button onclick="press('7')">7</button>
    <button onclick="press('8')">8</button>
    <button onclick="press('9')">9</button>
    <button class="operator" onclick="press('*')">×</button>

    <button onclick="press('4')">4</button>
    <button onclick="press('5')">5</button>
    <button onclick="press('6')">6</button>
    <button class="operator" onclick="press('-')">−</button>

    <button onclick="press('1')">1</button>
    <button onclick="press('2')">2</button>
    <button onclick="press('3')">3</button>
    <button class="operator" onclick="press('+')">+</button>

    <button onclick="press('0')">0</button>
    <button onclick="press('.')">.</button>
    <button onclick="backspace()">⌫</button>
    <button class="operator" onclick="calculate()">=</button>
  </div>
</section>

<section id="library">
  <header>
    <h1>Game Library</h1>
    <input id="search" placeholder="Search games..." oninput="renderGames()">
    <button onclick="closeLibrary()" style="padding:11px;border:0;border-radius:9px;cursor:pointer">Close</button>
  </header>

  <nav id="categories">
    <button class="active" onclick="setCategory('All',this)">All</button>
    <button onclick="setCategory('Arcade',this)">Arcade</button>
    <button onclick="setCategory('Puzzle',this)">Puzzle</button>
    <button onclick="setCategory('Racing',this)">Racing</button>
    <button onclick="setCategory('Strategy',this)">Strategy</button>
  </nav>

  <div id="games"></div>
  <p id="empty">No games match your search.</p>
</section>

<section id="viewer">
  <div id="viewerbar">
    <strong id="gameTitle">Game</strong>
    <button onclick="closeViewer()">Close game ✕</button>
  </div>
  <iframe id="gameframe" title="Game viewer"
    sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock"
    allowfullscreen></iframe>
</section>

<script>
const display = document.getElementById('display');
let expression = '';
let category = 'All';

function press(value){
  if(display.value === 'Error') clearCalc();
  expression += value;
  display.value = expression || '0';
}
function clearCalc(){
  expression = '';
  display.value = '0';
}
function backspace(){
  expression = expression.slice(0,-1);
  display.value = expression || '0';
}
function calculate(){
  if(expression === '6767'){
    clearCalc();
    document.getElementById('calculator').style.display = 'none';
    document.getElementById('library').style.display = 'block';
    return;
  }
  if(!expression) return;
  if(!/^[0-9+\-*/(). ]+$/.test(expression)){
    display.value = 'Error'; expression = ''; return;
  }
  try{
    const result = Function('"use strict";return ('+expression+')')();
    if(!Number.isFinite(result)) throw new Error();
    expression = String(result);
    display.value = expression;
  }catch{
    expression = '';
    display.value = 'Error';
  }
}
document.addEventListener('keydown',e=>{
  if(document.getElementById('library').style.display === 'block'){
    if(e.key === 'Escape') closeViewer();
    return;
  }
  if(/^[0-9.+\-*/()]$/.test(e.key)) press(e.key);
  else if(e.key === 'Enter') calculate();
  else if(e.key === 'Backspace') backspace();
  else if(e.key === 'Escape') clearCalc();
});

const games = [
 ['Neon Dash','Arcade','A colourful, fast-paced challenge.','https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=600'],
 ['Pixel Worlds','Arcade','Explore a retro-inspired world.','https://images.unsplash.com/photo-1614294149010-950b698f72c0?w=600'],
 ['Turbo Circuit','Racing','Race around futuristic tracks.','https://images.unsplash.com/photo-1511919884226-fd3cad34687c?w=600'],
 ['Brain Blocks','Puzzle','Solve clever block puzzles.','https://images.unsplash.com/photo-1606092195730-5d7b9af1efc5?w=600'],
 ['Star Explorer','Arcade','Discover the stars.','https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?w=600'],
 ['Speedway','Racing','Put your driving skills to the test.','https://images.unsplash.com/photo-1503736334956-4c8f8e92946d?w=600'],
 ['Mind Maze','Puzzle','Find your way through the maze.','https://images.unsplash.com/photo-1511512578047-dfb367046420?w=600'],
 ['Castle Tactics','Strategy','Plan your next move.','https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600'],
 ['Cyber City','Arcade','A glowing neon city awaits.','https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=600'],

 ['Number Quest','Puzzle','Test your number skills.','https://images.unsplash.com/photo-1509228468518-180dd4864904?w=600'],
 ['Space Tactics','Strategy','Make smart moves among the stars.','https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=600'],
 ['Retro Arcade','Arcade','Classic arcade-inspired fun.','https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?w=600'],
 ['Ocean Puzzle','Puzzle','Explore a blue underwater world.','https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=600'],
 ['Mountain Run','Racing','Take on the mountain roads.','https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600'],
 ['Kingdom Plan','Strategy','Build your strategy carefully.','https://images.unsplash.com/photo-1518709594023-6eab9bab7b23?w=600'],
 ['Pixel Runner','Arcade','Keep moving and beat your best.','https://images.unsplash.com/photo-1552820728-8b83bb6b773f?w=600'],
 ['Circuit Rush','Racing','A new circuit challenge.','https://images.unsplash.com/photo-1486325212027-8081e485255e?w=600'],
 ['Shape Shift','Puzzle','Match shapes and patterns.','https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600'],
 ['Galaxy Quest','Arcade','Journey beyond the horizon.','https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=600'],
 ['Tower Tactics','Strategy','Protect your tower with a plan.','https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=600'],
 ['Sunset Drive','Racing','Cruise into the sunset.','https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=600'],
 ['Logic Lab','Puzzle','Put your logic to work.','https://images.unsplash.com/photo-1518770660439-4636190af475?w=600'],
 ['Pixel Planet','Arcade','A tiny retro universe.','https://images.unsplash.com/photo-1614294149010-950b698f72c0?w=600'],
 ['Final Strategy','Strategy','Think ahead and make a plan.','https://images.unsplash.com/photo-1511512578047-dfb367046420?w=600']
];

function renderGames(){
  const term = document.getElementById('search').value.toLowerCase();
  const container = document.getElementById('games');
  container.innerHTML = '';
  let count = 0;

  games.forEach((game,index)=>{
    if(category !== 'All' && game[1] !== category) return;
    if(!(game[0]+' '+game[1]+' '+game[2]).toLowerCase().includes(term)) return;

    count++;
    const card = document.createElement('article');
    card.className = 'game';
    card.innerHTML = `
      <img src="${game[3]}" alt="" loading="lazy">
      <h3>${game[0]}</h3>
      <p>${game[1]} · Demo card</p>
    `;
    card.addEventListener('click',()=>openGame(index));
    container.appendChild(card);
  });
  document.getElementById('empty').style.display = count ? 'none' : 'block';
}
function setCategory(value,button){
  category = value;
  document.querySelectorAll('#categories button').forEach(b=>b.classList.remove('active'));
  button.classList.add('active');
  renderGames();
}
function openGame(index){
  const game = games[index];
  document.getElementById('gameTitle').textContent = game[0];
  const frame = document.getElementById('gameframe');
  frame.removeAttribute('srcdoc');
  frame.src = 'about:blank';
  document.getElementById('viewer').style.display = 'flex';
}
function closeViewer(){
  document.getElementById('viewer').style.display = 'none';
  document.getElementById('gameframe').src = 'about:blank';
}
function closeLibrary(){
  closeViewer();
  document.getElementById('library').style.display = 'none';
  document.getElementById('calculator').style.display = 'block';
  clearCalc();
}
renderGames();
</script>
</body>
</html>
