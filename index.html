
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CalcX</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  display: grid; place-items: center;
  background: #080d18; color: white;
  font-family: Arial, sans-serif;
}
.app {
  width: min(350px, 94vw); padding: 22px;
  background: #121b2c; border-radius: 22px;
  box-shadow: 0 15px 50px #0008;
}
h2 { color: #67e8f9; margin-top: 0; }
#display {
  width: 100%; padding: 20px 10px;
  background: #080d18; color: white;
  border: 0; border-radius: 12px;
  font-size: 28px; text-align: right;
  margin-bottom: 14px;
}
.keys {
  display: grid; grid-template-columns: repeat(4,1fr);
  gap: 8px;
}
button {
  padding: 17px 5px; border: 0;
  border-radius: 10px; background: #27364d;
  color: white; font-size: 18px; cursor: pointer;
}
button:hover { background: #3b4e68; }
.op { background: #087e99; }
#secret { display: none; margin-top: 18px; }
#secret p { color: #a5b4fc; }
</style>
</head>
<body>
<main class="app">
  <h2>CalcX</h2>
  <input id="display" value="0" readonly
         aria-label="Calculator display">
  <div class="keys" id="keys"></div>

  <section id="secret">
    <h3>Secret menu unlocked!</h3>
    <p>Welcome to the hidden CalcX settings.</p>
    <button onclick="changeTheme()">Change theme</button>
    <button onclick="hideSecret()">Close menu</button>
  </section>
</main>

<script>
const display = document.getElementById("display");
const keys = document.getElementById("keys");
const secret = document.getElementById("secret");

let expression = "";
let code = "";

const buttons = [
  "AC", "(", ")", "÷",
  "7", "8", "9", "×",
  "4", "5", "6", "−",
  "1", "2", "3", "+",
  "0", ".", "⌫", "="
];

buttons.forEach(key => {
  const b = document.createElement("button");
  b.textContent = key;
  if ("÷×−+=".includes(key)) b.className = "op";

  b.onclick = () => press(key);
  keys.appendChild(b);
});

function press(key) {
  if (key === "AC") {
    expression = "";
  } else if (key === "⌫") {
    expression = expression.slice(0, -1);
  } else if (key === "=") {
    try {
      if (!expression ||
          !/^[0-9+*/(). -]+$/.test(expression))
        throw Error();

      const result = Function(
        '"use strict"; return (' + expression + ')'
      )();

      if (!Number.isFinite(result)) throw Error();
      expression = String(result);
    } catch {
      expression = "";
      display.value = "Error";
      return;
    }
  } else {
    expression += ({
      "×": "*", "÷": "/", "−": "-"
    })[key] || key;
  }

  display.value = expression
    ? expression.replace(/\*/g, "×").replace(/\//g, "÷")
    : "0";
}

document.addEventListener("keydown", e => {
  if (/^[0-9]$/.test(e.key)) {
    code = (code + e.key).slice(-4);

    if (code === "6767") {
      secret.style.display = "block";
      code = "";
    }
  } else if (e.key === "Backspace") {
    press("⌫");
  } else if (e.key === "Enter") {
    press("=");
  } else if (e.key === "Escape") {
    hideSecret();
  } else if (/^[0-9.+*/()-]$/.test(e.key)) {
    press(e.key);
  }
});

function hideSecret() {
  secret.style.display = "none";
}

function changeTheme() {
  document.body.style.background =
    document.body.style.background === "rgb(8, 13, 24)"
      ? "#172554" : "#080d18";
}
</script>
</body>
</html>
